- id: salad-001
  name: 鳄梨西红柿沙拉
  scene: [light-meal]
  tags: [沙拉, 轻食, 抗炎]
  servings: 1
  cook_time: 15min
  cost: 约15元
  method: 凉拌
  ingredients:
    - { name: 鳄梨, amount: 1个 }
    - { name: 西红柿, amount: 2个 }
  steps:
    - 鳄梨、西红柿切块，淋橄榄油与柠檬汁，撒盐拌匀即可。
