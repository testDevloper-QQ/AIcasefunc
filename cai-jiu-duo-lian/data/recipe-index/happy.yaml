- id: hap-028
  name: 甜椒羽衣甘蓝一锅出
  scene:
  - happy
  tags:
  - 家常菜
  - 抗炎
  servings: 4
  cook_time: 20min
  cost: 约20元
  method: 炒
  ingredients:
  - name: 甜椒
    amount: 3~4个，切片
  - name: 羽衣甘蓝叶
    amount: 1杯
  - name: 西红柿
    amount: 2~3个，切片
  - name: 青柠汁
    amount: 1茶匙
  - name: 生姜
    amount: 2~3片，切碎
  - name: 中等大小的洋葱
    amount: 2个，切碎
  - name: 姜黄粉
    amount: 1茶匙
  - name: 橄榄油
    amount: 2茶匙
  - name: 鸡汤
    amount: ½杯
  steps:
  - 在深锅中加热油，将洋葱和姜丝炒1~2分钟。
  - 加入甜椒，翻炒至熟透。
  - 加入羽衣甘蓝叶、盐、胡椒粉和姜黄粉，拌匀。小火煮4~5分钟。
