    amount: 2杯
  - name: 中等大小洋葱
    amount: 1个，切碎
  - name: 西红柿酱
    amount: 2汤匙
  - name: 姜黄粉
    amount: ½茶匙
  - name: 大蒜
    amount: 1茶匙，切碎
  - name: 姜片
    amount: 2英寸，切碎
  - name: 盐
    amount: 1茶匙
  - name: 辣椒粉
    amount: ½茶匙
  - name: 卷心菜叶
    amount: 6片
  - name: 橄榄油
    amount: 2汤匙
  steps:
  - 在平底锅中加热油，将洋葱煎至透明。
  - 加入鸡丁、姜丝、蒜末，炒至肉色变白。
  - 加入所有香料，搅拌均匀。
  - 加入西红柿酱，用文火炖至收汁。放在碗里放一边待用。
  - 在深平底锅中加入4~5杯水，煮沸。
  - 将卷心菜叶放入沸水中汆烫30~40秒。
  - 用冷水冲洗并去除茎。
  - 将卷心菜叶平铺在干净的案板上，然后铺上一层鸡肉混合物，卷起。做成单卷。
