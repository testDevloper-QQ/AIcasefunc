    amount: 2茶匙，切碎
  - name: 大蒜
    amount: 4~5瓣，切碎
  - name: 橄榄油
    amount: 2汤匙
  steps:
  - 将烤箱预热至华氏350度。
  - 在锅中加热油并将蒜末炒20~30秒。
