    amount: 2茶匙
  - name: 大蒜
    amount: 4~5瓣，切碎
  - name: 百里香
    amount: 1茶匙
  steps:
  - 将烤箱预热至华氏350度。
  - 用叉子刺破意面南瓜并将其放入烤盘中，烘烤40~45分钟。
  - 完成后，让它冷却。
  - 把意面南瓜切成两半，去掉籽粒。
  - 同时在平底锅加热油和烹饪蒜末20~40秒。
  - 加入小麦面粉，搅拌均匀。
  - 加入牛奶并连续搅拌直至像面糊一样浓稠。
  - 现在将平底锅从火上移开，加入帕玛森奶酪、盐、胡椒粉和百里香，将它们充分拌匀。
