- id: sea-014
  name: 丝瓜风鸡粥
  scene:
  - seasonal
  tags:
  - 节气
  - 应季
  - 小满
  - 粥
  servings: 2
  cook_time: 40min
  cost: 约20元
  method: 煮
  ingredients:
  - name: 大米
    amount: 100克
  - name: 糯米
    amount: 50克
  - name: 鸡胸肉
    amount: 适量
  - name: 丝瓜
    amount: 半根
  - name: 酱油
    amount: 少许
  - name: 盐
    amount: 少许
  steps:
  - 鸡胸肉洗净，撕成丝状，用酱油腌制5分钟；丝瓜去皮切丁。
  - 大米和糯米混合煮粥，至七分熟时，放入鸡丝和丝瓜。
  - 再煮5～10分钟，加入少许盐调味即可。
  source:
    book: 食帖的节气食桌
