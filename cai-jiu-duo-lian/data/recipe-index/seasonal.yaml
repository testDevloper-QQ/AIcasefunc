- id: sea-015
  name: 迷迭香烤马铃薯
  scene:
  - seasonal
  tags:
  - 节气
  - 应季
  - 夏至
  - 烤
  servings: 2
  cook_time: 35min
  cost: 约15元
  method: 烤
  ingredients:
  - name: 马铃薯
    amount: 300克
  - name: 大蒜
    amount: 3瓣
  - name: 橄榄油
    amount: 30毫升
  - name: 迷迭香
    amount: 适量
  - name: 盐
    amount: 少许
  steps:
  - 马铃薯留皮切厚片，用厨房纸控干水分。
  - 食品袋中加入橄榄油、迷迭香和少许盐，轻揉使食材与调料混合均匀。
  - 烤箱预热10分钟，将马铃薯码在铺好锡纸的烤盘中。
  - 设定220℃烘烤20分钟，翻面后以200℃再烘烤5分钟，然后取出。
  - 在马铃薯上淋少许橄榄油增香，用鲜欧芹碎装饰即可。
  source:
    book: 食帖的节气食桌
    file: 参考书籍/食帖的节气食桌 (食贴番组, Shitiefanzu, editor).md
    chapter: 迷迭香烤马铃薯
