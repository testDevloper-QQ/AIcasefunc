- id: sea-011
  name: 越南春卷
  scene:
  - seasonal
  tags:
  - 节气
  - 应季
  - 谷雨
  - 轻食
  servings: 4
  cook_time: 90min
  cost: 约30元
  method: 卷
  ingredients:
  - name: 越南春卷米皮
    amount: 12张
  - name: 干粉丝
    amount: 350克
  - name: 黄瓜
    amount: 1/2根
  - name: 紫甘蓝
    amount: 50克
  - name: 黄彩椒
    amount: 2个
  - name: 红彩椒
    amount: 2个
  - name: 大叶生菜
    amount: 适量
  - name: 胡萝卜
    amount: 适量
  steps:
  - 粉丝煮熟，放凉待用。
  - 将米皮用热水浸湿后，快速铺平，向内折叠。
  - 放入粉丝、蔬菜等馅料，卷好即可。
  - 制作蘸料：小火煮沸后去沫，调好其他次料即可。
  source:
