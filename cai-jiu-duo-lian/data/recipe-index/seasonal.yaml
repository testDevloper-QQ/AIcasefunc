- id: sea-012
  name: 茭白青椒炒蚕豆
  scene:
  - seasonal
  tags:
  - 节气
  - 应季
  - 立夏
  - 炒
  servings: 2
  cook_time: 15min
  cost: 约15元
  method: 炒
  ingredients:
  - name: 茭白
    amount: 2根
  - name: 青椒
    amount: 适量
  - name: 蚕豆
    amount: 1小碗
  - name: 酱油
    amount: 1茶匙
  - name: 糖
    amount: 少许
  - name: 盐
    amount: 少许
  - name: 白胡椒粉
    amount: 少许
  steps:
  - 茭白、青椒切丝，蚕豆洗净待用。
  - 蚕豆在盐水中焯1分钟后捞出，放凉后去皮沥干待用。
  - 热锅倒入适量油，快速翻炒约2分钟。
  - 倒入茭白丝、蚕豆、1茶匙酱油和少许糖，继续翻炒至出香。
  - 出锅前倒入盐和少许白胡椒粉调味即可。
  source:
    book: 食帖的节气食桌
    file: 参考书籍/食帖的节气食桌 (食贴番组, Shitiefanzu, editor).md
    chapter: 茭白青椒炒蚕豆
- id: sea-013
  name: 麻辣小龙虾
  scene:
  - seasonal
  tags:
  - 节气
  - 应季
  - 立夏
  - 麻辣
  servings: 2
  cook_time: 60min
  cost: 约60元
  method: 煮
  ingredients:
  - name: 小龙虾
    amount: 500克
  - name: 花椒
    amount: 50克
  - name: 八角
    amount: 适量
  - name: 干辣椒
    amount: 80克
  - name: 郫县豆瓣酱
    amount: 适量
  - name: 大葱
    amount: 适量
  - name: 大蒜
    amount: 3瓣
  - name: 姜片
    amount: 3片
  - name: 酱油
    amount: 1茶匙
  - name: 白糖
    amount: 1茶匙
  steps:
  - 小龙虾清洗干净，剪掉胃部，去除虾线后待用。
  - 葱切段，大蒜切片待用。
  - 清水煮小龙虾至水沸腾，捞出小龙虾后留一部分水。
  - 起油锅，倒入葱、姜、蒜、花椒和干辣椒爆香后，再入其他调料。
  source:
    book: 食帖的节气食桌
