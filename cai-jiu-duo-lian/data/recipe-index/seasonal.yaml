  name: 玉米排骨汤
  scene:
  - seasonal
  tags:
  - 节气
  - 应季
  - 处暑
  - 汤
  servings: 3
  cook_time: 100min
  cost: 约30元
  method: 炖
  ingredients:
  - name: 排骨
    amount: 500克
  - name: 玉米
    amount: 1根
  - name: 胡萝卜
    amount: 1根
  - name: 姜
    amount: 3片
  - name: 料酒
    amount: 1汤匙
  - name: 白醋
    amount: 少许
  - name: 盐
    amount: 少许
  steps:
  - 玉米、胡萝卜、排骨分别切块。
  - 将排骨块冷水下锅，焯水沥干待用。
  - 炖锅中倒适量水，放入排骨、玉米、姜片、料酒、几滴白醋。
  - 大火烧开后转小火，焖煮1小时。
  - 放入胡萝卜，再继续煮40分钟，撒少许盐调味即可。
  source:
    book: 食帖的节气食桌
    file: 参考书籍/食帖的节气食桌 (食贴番组, Shitiefanzu, editor).md
    chapter: 玉米排骨汤
