    amount: 1小束
  steps:
  - 在食品加工机中加入牛肉末、洋葱、面包片、鸡蛋、橄榄油、盐、辣椒粉、大蒜、孜然粉和肉桂粉，加工成泥。2、加入洋葱和西红柿。混合均匀。
  - 用混合物做成小馅饼并压平。
  - 在不粘锅中加热油，用中火将肉串浅煎至熟透。
