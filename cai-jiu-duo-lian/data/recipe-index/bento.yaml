- id: ben-004
  name: 早餐能量棒
  scene:
  - bento
  - happy
  tags:
  - 早餐
  - 快手
  - 抗炎
  servings: 4
  cook_time: 0min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 红枣
    amount: 2杯，去核
  - name: 椰子肉
    amount: 1杯，磨碎
  - name: 燕麦
    amount: 半杯
  - name: 蜂蜜
    amount: 4汤匙
  - name: 可可粉
    amount: ½杯
  - name: 杏仁
    amount: ½杯
  - name: 核桃
    amount: ¼杯
  steps:
  - 在食品加工机中，放进红枣并加入3~4汤匙水，搅拌加工至糊状。
  - 加入椰子肉、燕麦、核桃、杏仁、可可粉和蜂蜜。再次处理，直到所有材料都拌匀。
  - 用烤盘纸垫在一个深而方的平底锅上衬底。
  - 将拌好的混合物倒入锅中，用刮铲均匀地按压。
  - 将平底锅放入冰箱，搁置20~30分钟。
  - 完成后从冰箱取出，用快刀切割，分隔成条状。
  source:
    book: 抗炎食谱100例
    file: 参考书籍/抗炎食谱100例 (Anti-Inflammatory Diet Cookbook Simple Recipes to Heal the
      Immune System and Improving Health) (亚历克斯·巴拉克斯).md
    chapter: 抗炎食谱100例
