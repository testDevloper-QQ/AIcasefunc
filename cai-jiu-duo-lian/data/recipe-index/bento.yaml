- id: ben-063
  name: 猪肉烤串
  scene:
  - bento
  - happy
  tags:
  - 烤箱
  - 抗炎
  servings: 4
  cook_time: 20min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 猪肉
    amount: 18盎司，去骨，切成小块
  - name: 柠檬汁
    amount: ¼杯
  - name: 醋
    amount: 1汤匙
  - name: 盐
    amount: 1茶匙
  - name: 迷迭香
    amount: 1茶匙
  - name: 黑胡椒粉
    amount: 1茶匙
  - name: 姜粉
    amount: 1茶匙
  - name: 大蒜粉
    amount: 1茶匙
  - name: 甜椒
    amount: 4~5个，切丁
  - name: 红洋葱
    amount: 2个，切丁
  steps:
  - 将猪肉、盐、胡椒、柠檬汁、醋和迷迭香加入碗中。混合均匀，放入冰箱中浸泡8~9小时或一整夜。
  - 把猪肉和蔬菜穿成肉串。
  - 预热烤架并刷上食用油。
  - 将肉串放在热烤架上，每面烤7~8分钟。
  source:
    book: 抗炎食谱100例
