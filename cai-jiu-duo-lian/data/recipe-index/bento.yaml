- id: ben-015
  name: 酸奶烤茄子卷
  scene:
  - bento
  - happy
  tags:
  - 烤箱
  - 抗炎
  servings: 6
  cook_time: 15min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 大茄子
    amount: 2个，切成薄片
  - name: 酸奶
    amount: 1杯
  - name: 姜黄粉
    amount: 1茶匙
  - name: 大蒜粉
    amount: ¼茶匙
  - name: 西红柿
    amount: 3个，切片
  - name: 橄榄油
    amount: 1茶匙
  - name: 盐和胡椒粉
    amount: 少许
  steps:
  - 预热烤架并刷上一些油润滑。
  - 在茄子片上撒些盐，放到烤架上。
  - 每一面烤4~5分钟。
  - 取一碗，放入酸奶、胡椒粉、姜黄粉、大蒜粉和一些盐混合，然后用叉子搅拌。
  - 茄子烤熟后，在每片上面放上酸奶混合物和番茄片。卷起。
  - 装盘享用。
