- id: ben-001
  name: 烤红薯配水果盘
  scene:
  - bento
  - happy
  tags:
  - 烤箱
  - 抗炎
  servings: 2
  cook_time: 20min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 大红薯
    amount: 1个
  - name: 香蕉
    amount: 1根，切片
  - name: 蓝莓
    amount: ½杯1
  - name: 覆盆子
    amount: ½杯
  - name: 蛋白粉
    amount: 1茶匙
  - name: 大麻籽
    amount: 1汤匙
  - name: 花生酱
    amount: 2茶匙
  - name: 奇亚籽
    amount: 1汤匙
  steps:
  - 预热烤箱至华氏355度。
  - 将红薯放入烤盘中烘焙15~20分钟。
  - 把烤好的红薯肉舀进两个就餐的碗里。
  - 在两个碗中均匀加入蛋白粉、蓝莓、覆盆子、香蕉和花生酱。
  - 装盘享用。
  - '* * *'
  - ' 杯（cup）,美国烹饪计量单位。液体: 1cup=150毫升，其它: 1cup=8盎司＝28.3495克。'
  source:
    book: 抗炎食谱100例
    file: 参考书籍/抗炎食谱100例 (Anti-Inflammatory Diet Cookbook Simple Recipes to Heal the
      Immune System and Improving Health) (亚历克斯·巴拉克斯).md
    chapter: 抗炎食谱100例
- id: ben-002
  name: 隔夜杏仁燕麦片
  scene:
  - bento
  - happy
  tags:
  - 早餐
  - 快手
  - 抗炎
  servings: 1
  cook_time: 0min
  cost: 约20元
  method: 煮
  ingredients:
  - name: 燕麦
    amount: ½杯
  - name: 杏仁牛奶
    amount: ½杯
  - name: 香草酸奶
    amount: ½杯
  - name: 枫糖浆
    amount: 1茶匙
  - name: 杏仁
    amount: 2汤匙，切碎
  - name: 蓝莓
    amount: ¼杯
  steps:
  - 在玻璃罐中加入燕麦、牛奶和枫糖浆，然后盖上盖子，摇匀。
  - 加入酸奶、杏仁和蓝莓。把盖子盖上，放在冰箱里搁置一个晚上。
  - 早餐时享用。
  source:
    book: 抗炎食谱100例
    file: 参考书籍/抗炎食谱100例 (Anti-Inflammatory Diet Cookbook Simple Recipes to Heal the
