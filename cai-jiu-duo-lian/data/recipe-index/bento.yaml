- id: ben-054
  name: 香烤全鸡
  scene:
  - bento
  - happy
  tags:
  - 烤箱
  - 抗炎
  servings: 6
  cook_time: 20min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 鸡
    amount: 1整只
  - name: 辣椒粉
    amount: 1汤匙
  - name: 盐
    amount: 1汤匙
  - name: 姜黄粉
    amount: 2茶匙
  - name: 孜然粉
    amount: 1汤匙
  - name: 肉桂粉
    amount: 1汤匙
  - name: 干香菜粉
    amount: 1汤匙
  - name: 牛至
    amount: 1茶匙
  - name: 迷迭香
    amount: 1茶匙
  - name: 酸奶
    amount: ¼杯
  - name: 青柠汁
    amount: 2汤匙
  - name: 生姜酱
    amount: 1汤匙
  steps:
  - 将烤箱预热至华氏355度。
  - 在碗里放入所有香料，蜂蜜，姜蒜酱，酸奶和草药。搅拌均匀。
  - 用香料混合物涂刷鸡身，然后在整只鸡身上擦抹，完全裹上一层料。
  - 将整只鸡放入烤盘中，烘烤45分钟，直至鸡身呈现金黄色。
  - 趁热享用。
