- id: ben-010
  name: 菠菜羽衣甘蓝煎蛋饼
  scene:
  - bento
  - happy
  tags:
  - 早餐
  - 快手
  - 抗炎
  servings: 4
  cook_time: 15min
  cost: 约20元
  method: 炒
  ingredients:
  - name: 鸡蛋
    amount: 4个，打散
  - name: 小洋葱
    amount: 1个，切碎
  - name: 菠菜叶
    amount: 2杯，切碎
  - name: 羽衣甘蓝叶
    amount: 1杯，切碎
  - name: 中等大小西红柿
    amount: 1个，切片
  - name: 椰子油
    amount: 3汤匙
  - name: 百里香
    amount: 1茶匙
  - name: 盐和胡椒粉
    amount: 少许
  steps:
  - 在不粘锅中加热椰子油，将洋葱片煎至透明。
  - 加入菠菜和羽衣甘蓝叶，然后炒1~2分钟。
  - 加入盐、胡椒粉和百里香调味。
  - 倒入打散的鸡蛋，把它们撒在平底锅上。
  - 加入西红柿，盖上盖子煮3~4分钟。
  - 把西红柿片小心地翻个面，再煮几分钟。
  - 装盘享用。
  - '# 第2章：午餐食谱'
