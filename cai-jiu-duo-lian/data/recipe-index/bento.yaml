- id: ben-012
  name: 姜黄烤花椰菜
  scene:
  - bento
  - happy
  tags:
  - 烤箱
  - 抗炎
  servings: 4
  cook_time: 15min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 花椰菜小花
    amount: 18盎司
  - name: 姜黄粉
    amount: 1茶匙
  - name: 黑胡椒粉
    amount: 1茶匙
  - name: 盐
    amount: 1茶匙
  - name: 橄榄油
    amount: 2茶匙
  - name: 孜然粉
    amount: ¼茶匙
  - name: 柠檬汁
    amount: 1茶匙
  steps:
  - 预热烤箱至华氏355度。
  - 取一大碗，加入花椰菜、盐、胡椒粉、姜黄粉、橄榄油、孜然粉和柠檬汁，充分搅拌混合。
  - 把花椰菜放在烤盘里烤10~15分钟，烤熟为止。
  - 装盘享用。
