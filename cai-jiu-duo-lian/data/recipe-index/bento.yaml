  - 烤箱
  - 抗炎
  servings: 6
  cook_time: 45min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 鸡肉
    amount: 6大块
  - name: 红辣椒粉
    amount: 1茶匙
  - name: 辣椒粉
    amount: ½茶匙
  - name: 盐
    amount: 2茶匙
  - name: 大蒜粉
    amount: 2茶匙
  - name: 姜黄粉
    amount: 1茶匙
  - name: 青柠汁
    amount: 2汤匙
  - name: 橄榄油
    amount: 2汤匙
  - name: 橘子
    amount: 2个，切成薄片
  - name: 洋葱
    amount: 2个，切成薄片
  - name: 球茎茴香
    amount: ¼个，切片
  - name: 孜然粉
    amount: 1茶匙
  steps:
  - 将烤箱预热到华氏355度。
  - 在碗里放入红辣椒粉、盐、辣椒粉、橙汁、大蒜粉、孜然粉、姜黄粉、芥末酱、橄榄油和青柠汁，并拌匀。
  - 加入鸡肉，把它完全裹上一层混合物。
  - 然后将鸡肉放入烤盘中，用橙片、洋葱片、茴香片和一些香菜叶覆盖在上面。
