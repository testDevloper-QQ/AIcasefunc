  method: 凉拌
  ingredients:
  - name: 大西红柿
    amount: 3个
  - name: 蛋黄酱
    amount: 1杯
  - name: 鸡肉
    amount: 1.5杯，去骨、煮熟、切丁
  - name: 小洋葱
    amount: 1个，切碎
  - name: 香菜
    amount: 1汤匙，切碎
  - name: 青柠汁
    amount: 1汤匙
  - name: 姜黄粉
    amount: ¼茶匙
  - name: 百里香
    amount: ¼茶匙，干的
  - name: 盐和胡椒粉
    amount: 少许
  steps:
  - 在每一个西红柿的蒂顶部切下一块，用勺子把果肉取出。
  - 在一个碗中，放入鸡肉、洋葱、百里香、青柠汁、盐、胡椒粉、姜黄粉、香菜和蛋黄酱充分搅拌。
  - 把鸡肉等混合物塞进西红柿中。
  - 把塞好馅的西红柿放在一个盘子里端上桌。
