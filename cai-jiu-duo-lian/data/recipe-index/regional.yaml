  method: 醉
  ingredients:
  - name: 苏北兴化螃蟹
    amount: 数只
  - name: 黄酒、盐、花椒
    amount: 适量
  steps:
  - 选兴化等地皮薄膏满的螃蟹，以醉法制作。
  - 醉后蟹膏呈紫色，蟹黄蟹膏饱满。
  - 与秃黄油同属江苏蟹馔传统，讲究时令与产地。
  - 可作冷盘佐酒，体现"鸭都"南京及苏北水乡食蟹文化。
