  method: 炖
  ingredients:
  - name: 霉干菜
    amount: 适量
  - name: 五花肉
    amount: 适量
  steps:
  - 浙江传统腌菜，经发酵晾晒而成，是江南家常必备。
  - 与五花肉同炖为经典霉干菜烧肉，干菜吸油解腻、肉香浸润干菜。
  - 亦可做霉干菜扣肉、汤面浇头等。
  - 体现浙菜"寻找绝妙食材"的乡土风味。
