- id: reg-016
  name: 天府花生
  scene:
  - regional
  tags:
  - 川渝
  - 小吃
  - 零食
  servings: 4
  cook_time: 10080min
  cost: 约15元
  method: 煮烤
  ingredients:
  - name: 天府3号花生
    amount: 适量
  - name: 盐水
    amount: 浸泡1～2天
  - name: 卤水（含甘草等20多种调料）
    amount: 适量
  steps:
  - 拣除破碎、不熟、虫蚀、损伤、发霉及特大特小粒，摘去果蒂。
  - 放入一定浓度盐水池浸泡1～2天，再入盐水锅煮熟，时间依花生大小而定。
  - 煮好后低温烘烤使之更干，火候要"又要干，又不要干"。
  - 以罗江老灶火炕烘烤，铺20厘米厚花生，不可烤出火气。
  - 剥开见花生仁饱满不缩，"像练出肌肉的胖子"，淡而回甘、回味无穷。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 天府花生
  line_art: assets/line-art/potato.svg
