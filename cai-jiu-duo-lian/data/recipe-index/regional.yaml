  ingredients:
  - name: 大连海参
    amount: 适量
  - name: 高汤
    amount: 适量
  steps:
  - 大连海参为东北名贵海产，体壁厚实、胶质丰富。
  - 需充分发制后，以高汤慢焖至软糯弹牙。
  - 常作宴席大菜，体现东北沿海与内陆饮食的交融。
  - 与长白山山珍同为东北寻味代表。
