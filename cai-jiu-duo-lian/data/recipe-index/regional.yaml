    amount: 适量
  - name: 豆豉、辣椒
    amount: 适量
  steps:
  - 顺德盛产鲮鱼，可煎、蒸、做鲮鱼滑等多种做法。
  - 香煎鲮鱼配豆豉辣椒为家常经典，外酥里嫩。
  - 鲮鱼滑可酿青椒、蒸肉饼，体现粤菜"不时不食"。
  - 与顺德搵食文化紧密相连，是广府老饕怀旧之选。
