- id: reg-001
  name: 灯影牛肉
  scene:
  - regional
  tags:
  - 川渝
  - 小吃
  - 牛肉
  servings: 4
  cook_time: 480min
  cost: 约80元
  method: 烤
  ingredients:
  - name: 精瘦牛肉（和尚头、红板、白板、佛坐子）
    amount: 100公斤（按比例）
  - name: 盐
    amount: 2公斤（每100公斤肉）
  - name: 糖
    amount: 1公斤（每100公斤肉）
  - name: 筚拨、山奈、桂子等香料
    amount: 适量
  - name: 芝麻油
    amount: 适量
  steps:
  - 选宣汉黄牛无筋精瘦肉，除净筋膜，按季节温度在缸中"出汗"熟成。
  - 牛肉以凉开水洗净，切1.5毫米薄片，与香料、盐、糖轻轻手拌，腌制15～20分钟。
  - 将肉片竖铺于抹了芝麻油的新竹筲箕上，片与片之间不留空隙。
  - 以电烤房慢烤约6小时或更长，期间不停翻动，至完全无水分、薄如灯影。
  - 以芝麻油完全浸泡保鲜，手捏取食，忌用筷力过大以免碎渣。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 灯影牛肉
  line_art: assets/line-art/beef.svg
- id: reg-002
  name: 四川香肠
  scene:
  - regional
  tags:
  - 川渝
  - 腊味
  - 年节
  servings: 6
  cook_time: 720min
  cost: 约60元
  method: 晾晒
  ingredients:
  - name: 猪前腿肉
    amount: 一秤（约500克）
  - name: 盐
    amount: 二两六
  - name: 冰糖或白糖
    amount: 二两三或二两五
  - name: 纯高粱酒
    amount: 三到四两
  - name: 青花椒
    amount: 适量
  - name: 猪小肠（肠衣）
    amount: 适量
  steps:
  - 冬至后选油气足的猪前腿肉，切成片状，用温水冲洗三遍除血水。
  - 按一秤肉二两六盐、二两三冰糖、三到四两高粱酒的比例调味，可加鲜润青花椒。
  - 将肉块灌入肠衣，扎针放气，挂竹竿晾晒。
  - 晨雾初起晒外阳台，残阳铺水时挂内阳台，来回移动半个多月。
  - 至肠皮发干不僵硬后收内阳台；食用时白水煮，切片配豆花或蘸糍粑海椒。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 四川香肠
  line_art: assets/line-art/beef.svg
- id: reg-003
  name: 清远鸡
  scene:
  - regional
  tags:
  - 广东
  - 白切
  - 年节
  servings: 4
  cook_time: 45min
  cost: 约80元
  method: 浸
  ingredients:
  - name: 清远鸡（未生育鸡项）
    amount: 1只
  - name: 姜
    amount: 适量
  - name: 盐
    amount: 适量
  steps:
  - 杀鸡做白切：在鸡背与颈交界处和屁股处划口，取出鸡胃、气管、食道及内脏，挖净鸡肺。
  - 烧"虾眼水"（微开冒小泡），将整鸡浸入，中途提起浸冻水冷激，再重新浸进热水。
  - 慢浸至熟透，剁开时骨髓带些许血红为火候恰当。
  - 出栏前"槽肥"减少活动、多喂食，保证适度油脂，皮黄肉滑。
  - 斩件上桌，配姜葱蘸料，皮爽肉滑、鸡有鸡味。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 清远鸡
  line_art: assets/line-art/chicken.svg
- id: reg-004
  name: 福州鱼丸
  scene:
  - regional
  tags:
  - 福建
  - 海鲜
  - 小吃
  servings: 4
  cook_time: 60min
  cost: 约40元
  method: 煮
  ingredients:
  - name: 鲢鱼或草鱼
    amount: 适量
  - name: 地瓜粉
    amount: 按鱼浆手感适量
  - name: 盐
    amount: 适量
  - name: 冰
    amount: 适量
  - name: 和好的猪肉糜
    amount: 适量
  steps:
  - 鲜鱼宰杀刮鳞去骨，刮鱼肉成蓉，加冰保持低温，混入地瓜粉与盐调味。
  - 机器或手打鱼浆至黏合，力度均匀，以手摸知何时打好。
  - 右手捏鱼浆，左手圆勺舀猪肉糜卷入鱼浆，一推一捏卷成滚圆鱼丸，立即入冷水防粘。
  - 清水煮鱼丸至浮起，配清汤、葱花即可。
  - 好鱼丸颜色略灰、表面坑坑洼洼，咬之弹性足、鱼味浓，中间猪肉馅鲜香。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 福州鱼丸
  line_art: assets/line-art/shrimp.svg
- id: reg-005
  name: 盐水鸭
  scene:
  - regional
  tags:
  - 江苏
  - 鸭馔
  - 冷盘
  servings: 4
  cook_time: 480min
  cost: 约88元
  method: 焐
  ingredients:
  - name: 高邮麻鸭（3斤8两至4斤2两）
    amount: 1只
  - name: 大籽盐
    amount: 适量
  - name: 花椒、八角
    amount: 适量
  - name: 百年老卤
    amount: 适量
  steps:
  - 活鸭冲净血水，进入"炒盐腌"：手工翻炒盐粒，赤手搓遍鸭身内外至鸭皮"出汗"。
  - 暖天静置2小时，天冷干腌2.5小时，再以老卤"清卤复"湿腌同等时长。
  - 挂通风处阴干，浸入水中，烧至将开未开、冒细泡时关火"焐得透"，中途翻面受热均衡。
  - 一只3斤8两至4斤2两鸭焐后约剩2斤4两至2斤6两。
  - 斩件呈皮白肉红骨头绿，配韭菜花、蒜泥、辣椒油、红方腐乳蘸食。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 盐水鸭
  line_art: assets/line-art/chicken.svg
- id: reg-006
  name: 秃黄油
  scene:
  - regional
  tags:
  - 江苏
  - 蟹宴
  - 江浙
  servings: 4
  cook_time: 360min
  cost: 约200元
  method: 烩
  ingredients:
  - name: 健康强壮螃蟹的膏和黄
    amount: 20多只四两蟹
  - name: 猪油
    amount: 适量
  - name: 白菊花水泡米（菊花精饭）
    amount: 适量
  - name: 紫苏、泡姜
    amount: 少许
  steps:
  - 选膏黄饱满的健康螃蟹，蒸熟后纯粹取膏和黄，剥离需半天。
  - 用猪油烩制，不能太碎也不能太整，不能太腻也不能不腻，以筷子可挑开、粉酥油润为度。
  - 配菊花精饭：白菊花水泡米，饭将熟未熟时倒入小朵黄菊温水，增菊花清气。
  - 小份盛盘，舀一勺秃黄油拌饭，配紫苏、泡姜解腻。
  - 苏州话"秃"即"忒"，意为特别纯粹的蟹膏蟹黄。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 秃黄油
  line_art: assets/line-art/shrimp.svg
- id: reg-007
  name: 金华火腿
  scene:
  - regional
  tags:
  - 浙江
  - 腊味
  - 年节
  servings: 6
  cook_time: 1440min
  cost: 约150元
  method: 腌
  ingredients:
  - name: 猪后腿（毛腿）
    amount: 1只
  - name: 海盐
    amount: 按35天周期分6～7次上盐
  steps:
  - 立冬到立春之间，选东阳等地猪后腿，35天左右腌制周期，上6～7次盐，每次部位与间隔不同。
  - 严格控制温度、湿度、盐颗粒度及腿表层与中心温度，使最终含盐量约10%。
  - 火腿分火爪、火踵、上方、中方、滴油五部分；上方质量最好，约占全腿35%。
  - 上方可切大片蒸制；火踵可整料炖或切块；中方切丝片条；火爪、滴油可炖汤提鲜。
  - 整只火腿需削去发酵保护层，淘米水浸泡后分切，清蒸中方加花雕即为经典吃法。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 金华火腿
  line_art: assets/line-art/beef.svg
- id: reg-008
  name: 湖南腊肉
  scene:
  - regional
  tags:
  - 湘赣
  - 腊味
  - 年节
  servings: 6
  cook_time: 720min
  cost: 约50元
  method: 熏
  ingredients:
  - name: 带皮猪肉（前腿、五花、后腿）
    amount: 10斤
  - name: 盐
    amount: 三两（十斤肉）
  steps:
  - 冬至后选200斤以上、肥瘦均匀的猪，猪肉带皮用盐腌：鱼5天、肉6天（夏天鱼不超过2天、肉不超过3天）。
  - 晾晒2～3天后开始熏烘，乔口一带熏2～4天，讲究黄里透红、不放香料保原味。
  - 大铁桶架铁棍，桶底铺谷糠，点燃后只留烟不见明火，常年慢慢熏。
  - 也可做"风吹肉"：腌好后挂屋里通风处，省却熏制，数日后可炒食。
  - 腊味合蒸、腊牛肉炒大蒜苗、腊鸡炒酱辣椒为家常吃法。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 湖南腊肉
  line_art: assets/line-art/beef.svg
- id: reg-009
  name: 白肉血肠
  scene:
  - regional
  tags:
  - 东北
  - 满族
  - 年节
  servings: 4
  cook_time: 180min
  cost: 约60元
  method: 煮
  ingredients:
  - name: 下五花肉（300斤阉猪）
    amount: 十来斤
  - name: 猪血（或血清）
    amount: 适量
  - name: 猪明肠（大肠头约3尺）
    amount: 适量
  - name: 茴香、大料、丁香、砂仁等24种调料
    amount: 适量
  - name: 韭菜花、蒜泥、辣椒油、红方腐乳
    amount: 各一碟
  steps:
  - 下五花肉冰水泡后青条石压数小时排酸，穿铁叉明火上烤至肉皮起燎泡，过水刷净。
  - 肉皮朝下、肉里朝上，只用清水大火煮开、文火炖烂，趁热片成薄如纸帛的长片。
  - 血清或混血加24种调料灌入明肠，清水煮熟，冷却后切厚片，开水烫后成"灯碗"状。
  - 白肉层层相叠，血肠形如灯碗浮于汤中，配四种酱碟上桌。
  - 白肉肥而不腻，血肠鲜美滑嫩，肠衣一咬即破，毫无腥臭。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 白肉血肠
  line_art: assets/line-art/beef.svg
- id: reg-010
  name: 血粑鸭
  scene:
  - regional
  tags:
  - 湘赣
  - 湘西
  - 年节
  servings: 4
  cook_time: 60min
  cost: 约50元
  method: 炖
  ingredients:
  - name: 喂养年把的麻鸭
    amount: 1只
  - name: 糯米
    amount: 八两（一只鸭配八两）
  - name: 现杀鸭血
    amount: 适量
  - name: 猪肥肉、花椒、菜子油
    amount: 适量
  - name: 生姜、食盐、酱油、大红椒
    amount: 适量
  - name: 茶油
    amount: 适量
  steps:
  - 糯米头晚浸泡，次日现杀鸭血滴入糯米，加少许盐搅匀，凝固后上锅蒸约1小时。
  - 出锅血粑切块，用茶油稍稍煎炸至外酥里糯。
  - 猪肥肉、花椒、菜子油下锅炒香，加鸭子、生姜爆炒，入食盐、酱油和清水，大火炖20多分钟。
  - 放红椒切片，鸭肉煮熟后将血粑块放入小煮，至金黄色，让血粑饱吸鸭汤而锅仍清澈。
  - 姜分三次下：与肥肉同炒出料香、半路保原味、出锅前再入增香。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 湘西凤凰：血粑鸭、桐叶粑与苗家社饭
  line_art: assets/line-art/chicken.svg
- id: reg-011
  name: 石屏豆腐
  scene:
  - regional
  tags:
  - 西南
  - 云南
  - 小吃
  servings: 4
  cook_time: 30min
  cost: 约20元
  method: 烤
  ingredients:
  - name: 石屏豆腐块
    amount: 几十块
  - name: 盐
    amount: 少许
  - name: 甜咸酱油、卤腐汁、花椒油、香菜、薄荷、糊辣子
    amount: 按口味
  - name: 鸭油（可选）
    amount: 少许
  steps:
  - 新鲜豆腐放上几天，撒少许盐腌制，可放2～6天，越久越咸、略带发酵臭。
  - 切麻将块大小，架在烧木炭的烧烤铁网上，用竹签不停翻面。
  - 翻面太早受热不够，稍迟则出现焦黑点；恰到好处时表皮金黄微胀，能吸收蘸料又不失酥脆。
  - 可选涂鸭油增香防煳；配甜咸酱油、卤腐汁、花椒油等蘸料。
  - 石屏豆腐用地下酸涩井水点制，烤后不收缩，内里满满当当、密实细嫩。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 石屏豆腐
  line_art: assets/line-art/tomato.svg
- id: reg-012
  name: 慈城年糕
  scene:
  - regional
  tags:
  - 浙江
  - 年节
  - 米食
  servings: 6
  cook_time: 120min
  cost: 约30元
  method: 蒸
  ingredients:
  - name: 粳米（水磨米粉）
    amount: 适量
  - name: 桂花糖（甜馅）
    amount: 适量
  - name: 雪里蕻、油条、豆腐干、虾皮（咸馅）
    amount: 适量
  steps:
  - 将沥干的米粉一层层均匀撒入蒸笼蒸粉。
  - 搡好的粉团可揪块捏成小动物形状，甜馅加桂花糖，咸馅加雪里蕻、油条、豆腐干、虾皮。
  - 年糕以三条横、三条竖垂直交叉叠放，垒七八层，最上方盖红纸，寓意吉祥。
  - 水缸浸存可常鲜；亦可切片晒干成干年糕片，夏季与万年青同炒。
  - 煤球炉蒸软后蘸白糖，或做青菜炒年糕，宁波年糕"久浸不坏最圣洁"。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 慈城年糕
  line_art: assets/line-art/potato.svg
- id: reg-013
  name: 红龟粿
  scene:
  - regional
  tags:
  - 福建
  - 闽南
  - 年节
  servings: 8
  cook_time: 90min
  cost: 约20元
  method: 蒸
  ingredients:
  - name: 糯米
    amount: 适量
  - name: 白糖
    amount: 适量
  - name: 芝麻、花生（甜馅）
    amount: 适量
  - name: 龟印木模
    amount: 1个
  - name: 粽叶
    amount: 适量
  steps:
  - 糯米洗净浸泡2小时，磨浆后入布袋扎紧，压重物10～12小时压干。
  - 干米浆加白糖搅拌，搓成米团包入芝麻花生甜馅。
  - 放在龟印上压出寿龟纹样，底部垫粽叶、刷油。
  - 入笼屉蒸10分钟即成；供奉后可直吃、蒸吃，或裹蛋清煎吃。
  - 红壳甜馅，黏糯外壳配香甜馅料，闽南祭拜与节庆必备"红龟"。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 红龟粿
  line_art: assets/line-art/tomato.svg
- id: reg-014
  name: 宣威火腿
  scene:
  - regional
  tags:
  - 西南
  - 云南
  - 腊味
  servings: 4
  cook_time: 4320min
  cost: 约100元
  method: 腌
  ingredients:
  - name: 宣威猪后腿
    amount: 1只
  - name: 盐
    amount: 按传统配方
  - name: 洋芋（土豆）
    amount: 适量
  steps:
  - 霜降后至农历冬月腊月，7～10℃低温腌制，抑制微生物与酶活性。
  - 用竹签或骨签扎入火腿上、中、下部及血筋位置，闻清香为上品。
  - 皇冠腿（中间精华）可整只慢炖若干小时，连汤带肉上大砂锅。
  - 前端（靠近猪尾）最厚、吃盐不多，切薄片炒蔬菜，勿再放盐。
  - 家常做法：肥瘦相间火腿片铺满洋芋一起蒸，出锅瘦肉嫣红、肥肉白润，洋芋尽得火腿精华。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 宣威火腿
  line_art: assets/line-art/beef.svg
- id: reg-015
  name: 文昌鸡
  scene:
  - regional
  tags:
  - 海南
  - 白切
  - 四大名菜
  servings: 4
  cook_time: 25min
  cost: 约80元
  method: 浸
  ingredients:
  - name: 文昌鸡（3斤至3斤半）
    amount: 1只
  - name: 姜片、青蒜
    amount: 少许
  - name: 酸橘、生抽、蒜泥、小红椒
    amount: 适量（蘸料）
  steps:
  - 烧两口锅：先将整鸡放入清水锅煮6～10分钟。
  - 取出放入另一锅调入盐等调料的水中，烫煮5分钟起锅。
  - 不去骨斩件，骨头带少许血水，皮脆肉嫩为正宗。
  - 打边炉做法：一锅白水加姜片、青蒜，斩块鸡肉下锅涮食，配酸橘、生抽、蒜泥、小红椒。
  - 鸡饭：大米先炒后加鸡汤、鸡油煮，或做成"饭珍"饭团，寓意全家圆满。
  source:
    book: 食遍中国
    file: 参考书籍/食遍中国 (三联生活周刊).md
    chapter: 文昌鸡和老爸茶
