- id: reg-022
  name: 米花糖
  scene:
  - regional
  tags:
  - 西南
  - 贵州
  - 小吃
  servings: 6
  cook_time: 60min
  cost: 约20元
  method: 炒
  ingredients:
  - name: 糯米（炒米花）
    amount: 适量
  - name: 麦芽糖
    amount: 适量
  - name: 花生、芝麻
    amount: 适量
  steps:
  - 糯米蒸熟后晒干，用石英砂入锅炒香，筛出成炒米花。
  - 以麦芽糖熬浆，与炒米花、花生、芝麻等拌匀压块。
  - 冷却切块，酥脆香甜，是贵州传统年节小食。
  - 与广西粽子、贵州酸腌之味同属西南食俗。
  source:
